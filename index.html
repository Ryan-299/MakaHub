<html lang="en-KE">

<head>
  <meta charset="UTF-8" />

  <!-- Icons -->

  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)" />

  <!-- Link previews: WhatsApp, Facebook, LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rentike" />
  <meta property="og:locale" content="en_KE" />
  <meta property="og:url" content="https://rentike.co.ke/" />
  <meta property="og:title" content="Rentike — Find a place you'll call home" />

    content="Discover available rental homes across Kenya: houses, bedsitters, single rooms and apartments." />

  <meta property="og:image" content="https://rentike.co.ke/pwa-512x512.png" />
  <meta property="og:image:alt" content="Rentike logo" />

  <!-- Link previews: X (Twitter) -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Rentike — Find a place you'll call home" />
  <meta name="twitter:description"
    content="Discover available rental homes across Kenya: houses, bedsitters, single rooms and apartments." />
  <meta name="twitter:image" content="https://rentike.co.ke/pwa-512x512.png" />

  <!-- Tells Google what Rentike is (name + logo in search results) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://rentike.co.ke/#website",
        "url": "https://rentike.co.ke/",
        "name": "Rentike",
        "description": "Rental homes across Kenya: houses, bedsitters, single rooms and apartments.",
        "inLanguage": "en-KE"
      },
      {
        "@type": "Organization",
        "@id": "https://rentike.co.ke/#organization",
        "name": "Rentike",
        "url": "https://rentike.co.ke/",
        "logo": "https://rentike.co.ke/pwa-512x512.png"
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('makaohub_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved === 'dark' || ((!saved || saved === 'system') && systemDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0D0D0D';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F7F3EC';
        }
      } catch (e) { }
    })();
  </script>
</head>

<body
  class="text-[#121212] dark:text-[#F5F5F5] antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
